name: Promemoria timbrature

# Avvisa via push chi non ha ancora timbrato entrata (8:00), pausa pranzo
# (12:45), rientro dalla pausa (13:45) o uscita (17:00).
#
# La schedulazione vera è su un cron esterno (cron-job.org, ogni 15 minuti
# 06:00-16:00 UTC lun-ven) che chiama /api/cron/promemoria-timbrature
# direttamente: lo `schedule` di GitHub Actions su questo account arriva
# sistematicamente con 4-7 ore di ritardo (verificato sul keep-alive),
# inutilizzabile per orari precisi. Questo workflow resta solo per lanci
# manuali di test.
#
# Richiede un secret nel repo (Settings → Secrets and variables → Actions):
#   - CRON_SECRET (stesso valore della env var CRON_SECRET su Vercel)

on:
  workflow_dispatch: {}

jobs:
  promemoria:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama la route dei promemoria
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "::error::Secret CRON_SECRET mancante"; exit 1; fi
          # -L: cantivo.it (apex) fa redirect 308 verso www.cantivo.it — senza
          # seguirlo curl riceve il 308 invece della risposta della route.
          code=$(curl -sL -o /tmp/risposta.json -w "%{http_code}" \
            -H "x-cron-secret: $SECRET" \
            "https://cantivo.it/api/cron/promemoria-timbrature")
          echo "HTTP $code"
          cat /tmp/risposta.json
          case "$code" in 200) exit 0 ;; *) echo "::error::Risposta inattesa ($code)"; exit 1 ;; esac
